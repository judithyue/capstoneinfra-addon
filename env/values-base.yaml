# 1. Configured for the official community format
provider: aws

# FIX: The upstream chart expects these arguments passed as extraArgs
extraArgs:
  - --aws-zone-type=public

sources:                  # Instructs ExternalDNS to watch both standard LoadBalancer Services and Ingress routes
  - service
  - ingress

# FIX: Upstream uses environment variables for the AWS Region
env:
  - name: AWS_REGION
    value: ap-southeast-1 

policy: sync              # Automatically creates AND deletes records when apps are removed
txtOwnerId: "mightycapstone-eks-cluster" # Tracks ownership of records in Route 53

serviceAccount:
  create: true
  name: external-dns
  automountServiceAccountToken: true # <-- Fixes the token mounting issue globally